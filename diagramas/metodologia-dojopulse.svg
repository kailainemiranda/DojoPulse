<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#223047"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8d9aaa" flood-opacity=".18"/>
    </filter>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#152238}.subtitle{font:400 14px Arial,sans-serif;fill:#718096}.label{font:700 15px Arial,sans-serif;fill:#152238}.duration{font:400 12px Arial,sans-serif;fill:#718096}.small{font:400 11px Arial,sans-serif;fill:#718096}.line{stroke:#223047;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.box{fill:#fff;stroke:#223047;stroke-width:2;rx:4;filter:url(#shadow)}.start{fill:#f4f7fb;stroke:#223047;stroke-width:2}.end{fill:#e8f8f1;stroke:#2b8b63;stroke-width:2}.accent{fill:#00d2ff;stroke:#008eaa;stroke-width:2}.accentText{fill:#05202b}.pink{fill:#fff0f7;stroke:#ff007f;stroke-width:2}.purple{fill:#f5edff;stroke:#a812ed;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="subtitle">Kailaine Barbosa Miranda - RU 4832461</text>
  <line x1="80" y1="80" x2="1520" y2="80" stroke="#dbe2ea" stroke-width="2"/>

