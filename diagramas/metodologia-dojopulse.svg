  <path d="M230 480 H185" class="line"/>
  <rect x="20" y="433" width="160" height="94" class="accent"/><text x="100" y="465" text-anchor="middle" class="label accentText">Publicação</text><text x="100" y="485" text-anchor="middle" class="label accentText">GitHub Pages</text><text x="100" y="508" text-anchor="middle" class="duration accentText">Duração: 1 dia</text>
  <path d="M100 527 V625 H230" class="line"/>
  <ellipse cx="310" cy="625" rx="82" ry="38" class="end" filter="url(#shadow)"/><text x="310" y="621" text-anchor="middle" class="label">Fim do</text><text x="310" y="640" text-anchor="middle" class="label">projeto</text>
