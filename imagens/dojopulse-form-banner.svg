    <path d="M120 125h195M1285 125h195"/>
  </g>
  <g opacity=".16" stroke="#00d2ff" stroke-width="2">
    <path d="M90 238h1420M210 204h1180M300 170h1000"/>
  </g>

  <path d="M0 244h1600v156H0z" fill="url(#floor)"/>
  <path d="M0 244h1600" stroke="#00d2ff" stroke-width="3" opacity=".8" filter="url(#glowCyan)"/>
