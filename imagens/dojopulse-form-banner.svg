    <text x="35" y="38" fill="#07101c" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12">DP</text>
    <text x="70" y="30" fill="#f4f7fb" font-family="Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="1">DOJOPULSE</text>
    <text x="70" y="48" fill="#98a8bc" font-family="Arial, sans-serif" font-size="10" letter-spacing="2">ACADEMIA EM MOVIMENTO</text>
  </g>

