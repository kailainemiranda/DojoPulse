    <path d="M66 25c5-28 44-35 59-2-13-6-35-7-59 2z" fill="#0b111e"/>
    <path d="M67 66c14-20 43-20 57 0l30 75H35z" fill="#e8bb3f"/>
    <path d="M55 78l-72 34M135 78l78 47" stroke="#e8bb3f" stroke-width="19" stroke-linecap="round"/>
