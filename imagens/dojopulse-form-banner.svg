<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">DojoPulse - Academia em movimento</title>
  <desc id="desc">Ilustracao de um dojo com tatame, faixa e dois praticantes treinando.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091225"/>
      <stop offset="0.58" stop-color="#111c34"/>
      <stop offset="1" stop-color="#241336"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162743"/>
      <stop offset="1" stop-color="#080f1d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d2ff"/>
      <stop offset="1" stop-color="#72e8ff"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff007f"/>
      <stop offset="1" stop-color="#ff6ab7"/>
    </linearGradient>
    <filter id="glowCyan"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowPink"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1600" height="400" fill="url(#sky)"/>
  <circle cx="1370" cy="-20" r="220" fill="#a812ed" opacity=".13"/>
  <circle cx="155" cy="355" r="260" fill="#00d2ff" opacity=".07"/>

  <g opacity=".28" stroke="#7d91b4" stroke-width="3" fill="none">
